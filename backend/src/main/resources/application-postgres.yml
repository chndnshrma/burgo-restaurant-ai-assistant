# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Create the database first:  createdb burgo
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/burgo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
